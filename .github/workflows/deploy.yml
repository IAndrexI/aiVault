name: Deploy aiVault to LXC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Pull and restart aiVault in LXC
        run: |
          TARGET_DIR="/opt/aiVault"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$(pwd)"
          fi
          cd "$TARGET_DIR"
          git fetch origin main
          git reset --hard origin/main
          if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
            docker compose up -d --build
          fi
