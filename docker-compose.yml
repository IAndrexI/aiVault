services:
  # 1. High-Performance Vector Database (Rust-based, low resource usage)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  # 2. Adaptive Memory Layer (Fact extraction, deduplication, conflict resolution)
  mem0:
    image: mem0/mem0:latest
    container_name: agent_mem0
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_HOST=agent_qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    depends_on:
      - qdrant
