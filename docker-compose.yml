services:
  # 1. High-Performance Vector Database (Rust-based, low resource usage)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  # 2. Local Ollama Engine for 100% Offline Embeddings and Fact Extraction
  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama

  # 3. Adaptive Memory Layer (Built locally via Dockerfile)
  mem0:
    build: .
    container_name: agent_mem0
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_HOST=agent_qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://agent_ollama:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-llama3.2:1b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - qdrant
      - ollama
