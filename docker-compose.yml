services:
  # 1. High-Performance Vector Database (Rust-based, low resource usage)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z

  # 2. Local Ollama Engine for 100% Offline Embeddings and Fact Extraction
  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama

  # 3. Adaptive Memory Layer (Built locally via Dockerfile)
  mem0:
    build: .
    container_name: agent_mem0
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_HOST=agent_qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.0.28:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-dolphin-llama3:8b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - qdrant
      - ollama

  # 4. Open WebUI (Unified Chat Interface + RTX 5080 GPU + Cloud API Bridge)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Primary GPU inference on RTX 5080 PC, fallback to container
      - OLLAMA_BASE_URLS=http://192.168.0.28:11434;http://agent_ollama:11434
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://agent_qdrant:6333
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest
      - RAG_OLLAMA_BASE_URL=http://192.168.0.28:11434
      - WEBUI_AUTH=true
    volumes:
      - ./open_webui_data:/app/backend/data
    depends_on:
      - qdrant
